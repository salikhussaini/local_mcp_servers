[project]
name = "databricks-local-mcp"
version = "0.1.0"
description = "Base local MCP server for Databricks in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12.0,<2",
  "databricks-sdk>=0.63.0",
]

[project.scripts]
databricks-local-mcp = "databricks_local_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["databricks_local_mcp*"]
