[project]
name = "bitbucket-local-mcp"
version = "0.1.0"
description = "Local MCP server for Bitbucket Cloud (read-only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.12.0,<2",
  "httpx>=0.27.0",
  "starlette>=0.37.0",
  "uvicorn>=0.30.0",
  "pytest>=8.0.0",
]

[project.scripts]
bitbucket-local-mcp = "bitbucket_local_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["bitbucket_local_mcp*"]
